name: Sync verified single-step images
on:
  workflow_dispatch:
    inputs:
      source_tag:
        required: true
        type: string
      source_commit:
        required: true
        type: string
      release_notes:
        required: true
        type: string
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_REPO: zhangqian-1/jingneng-power-forecast
      SOURCE_TAG: ${{ inputs.source_tag }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact version and download tested bundles
        run: |
          python - <<'PY'
          import os, re
          assert re.fullmatch(r'[0-9a-f]{40}', os.environ['SOURCE_COMMIT'])
          assert os.environ['SOURCE_TAG'] == 'v7station-single-step-' + os.environ['SOURCE_COMMIT'][:12]
          PY
          gh release download "$SOURCE_TAG" --repo "$SOURCE_REPO" --pattern 'offline-image-*.zip*' --dir delivery
      - name: Verify complete bundles and prepare handover
        run: |
          python - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          root = Path('delivery')
          files = sorted(root.glob('*.zip'))
          assert len(files) == 2
          platforms = set()
          checksums = []
          for path in files:
              with path.open('rb') as stream:
                  digest = hashlib.file_digest(stream, 'sha256').hexdigest()
              assert path.with_name(path.name + '.sha256').read_text().split()[0] == digest
              checksums.append(f'{digest}  {path.name}\n')
              with zipfile.ZipFile(path) as bundle:
                  release = json.loads(bundle.read('release.json'))
                  assert release['commit'] == os.environ['SOURCE_COMMIT']
                  assert release['model'] == 'single_step_7station_2025_v1'
                  assert release['api_timezone'] == 'UTC' and release['training_timezone'] == 'Asia/Shanghai'
                  assert release['metrics']['points'] == 7008
                  assert abs(release['metrics']['mape_percent'] - 3.1991141) < 0.01
                  for key in ('compose_smoke_test', 'container_recreation_test'):
                      assert release[key] == 'passed'
                  for key in ('export_import_test', 'import_prediction_test'):
                      assert release['offline_image'][key] == 'passed'
                  platforms.add(release['platform'])
                  checked = set()
                  for line in bundle.read('SHA256SUMS').decode().splitlines():
                      expected, name = line.split('  ', 1)
                      with bundle.open(name) as stream:
                          assert hashlib.file_digest(stream, 'sha256').hexdigest() == expected, name
                      checked.add(name)
                  assert set(bundle.namelist()) == checked | {'SHA256SUMS'}
                  assert not any(n.startswith(('tests/', 'runtime/', 'models/', '.git/')) for n in checked)
          assert platforms == {'linux/amd64', 'linux/arm64'}
          (root / 'SHA256SUMS').write_text(''.join(checksums), encoding='utf-8')
          (root / '交付说明.md').write_text(os.environ['RELEASE_NOTES'], encoding='utf-8')
          PY
      - name: Upload as draft and verify asset digests
        run: |
          if ! gh release view "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --title "七站单点预测：过去3天预测未来15分钟" --notes-file delivery/交付说明.md
          fi
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          repo, tag = os.environ['GITHUB_REPOSITORY'], os.environ['SOURCE_TAG']
          def get_release():
              releases = json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/releases?per_page=100']))
              return next(r for r in releases if r['tag_name'] == tag)
          release = get_release()
          assets = {a['name']:a for a in release['assets']}
          files = [p for p in Path('delivery').iterdir() if p.is_file()]
          for path in files:
              if path.name not in assets:
                  assert release['draft'], 'Do not change files in a published release'
                  subprocess.run(['gh','release','upload',tag,str(path),'--repo',repo],check=True)
          release = get_release()
          assets = {a['name']:a for a in release['assets']}
          assert set(assets) == {p.name for p in files}
          for path in files:
              with path.open('rb') as stream:
                  digest = hashlib.file_digest(stream, 'sha256').hexdigest()
              assert assets[path.name]['digest'] == 'sha256:' + digest
              assert assets[path.name]['size'] == path.stat().st_size
          PY
      - name: Publish verified download page
        run: gh release edit "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
